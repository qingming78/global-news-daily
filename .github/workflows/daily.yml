name: 每日生成日报

# 每天 00:00 UTC 运行 = 北京时间 08:00；也可以在 Actions 页面点
# “Run workflow” 手动触发一次。
on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  daily:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 安装 Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 抓取 RSS，生成今天那期
        run: python3 scripts/fetch_daily.py

      # 补人物思考：需要先在仓库 Settings → Secrets and variables → Actions
      # 里加一个叫 DEEPSEEK_API_KEY 的 Secret。没加时脚本会自动跳过，
      # 日报本身不受影响（只是思考字段留空）。
      - name: 补人物思考（有 key 才跑）
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
        run: python3 scripts/generate_thinking.py

      - name: 有新内容就提交回仓库
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data
          git diff --cached --quiet || git commit -m "日报 $(date -u +%Y-%m-%d)"
          git push
